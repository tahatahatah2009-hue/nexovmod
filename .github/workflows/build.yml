name: Build Android NDK Library

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile with Latest NDK
        uses: nttld/setup-ndk@v3
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Run Build
        run: |
          cd $GITHUB_WORKSPACE
          
          # إنشاء ملف التكوين لتحديد المعمارية
          cat << 'EOF' > Application.mk
          APP_ABI := arm64-v8a
          APP_PLATFORM := android-21
          EOF

          # تنفيذ البناء
          ndk-build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so
          path: libs/arm64-v8a/*.so
