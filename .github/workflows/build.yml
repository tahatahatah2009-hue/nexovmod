name: Build Android NDK Library

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up NDK and Build
        run: |
          # تحميل وتثبيت NDK يدوياً بكل سهولة
          echo "Downloading Android NDK..."
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          export NDK_ROOT=$PWD/android-ndk-r25b

          # إنشاء ملفات البناء
          cd $GITHUB_WORKSPACE
          cat << 'EOF' > Android.mk
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)
          LOCAL_MODULE := nexovmod
          LOCAL_SRC_FILES := main.cpp
          LOCAL_LDLIBS := -llog -landroid
          include $(BUILD_SHARED_LIBRARY)
          EOF

          cat << 'EOF' > Application.mk
          APP_ABI := arm64-v8a
          APP_PLATFORM := android-21
          EOF

          # تنفيذ البناء باستخدام NDK
          $NDK_ROOT/ndk-build

      - name: Upload compiled library
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so
          path: libs/arm64-v8a/*.so
